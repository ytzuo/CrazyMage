[package]
name = "unstable-mage"
version = "0.1.0"
description = "失控法师：魔法试验场单机动作法术游戏"
authors = ["satenyang"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "unstable_mage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
